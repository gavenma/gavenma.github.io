{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <a class="site-brand" href="{{ base_path }}/">{{ site.title }}</a>
      <nav id="primary-navigation" class="site-navigation" aria-label="Primary navigation" data-collapsed="true">
        <button class="site-navigation__toggle" type="button" aria-expanded="false" aria-controls="site-navigation-panel">
          <i class="fas fa-bars" aria-hidden="true"></i><span>Menu</span>
        </button>
        <div class="site-navigation__panel" id="site-navigation-panel" data-sliding-nav>
          <span class="nav-indicator" aria-hidden="true"></span>
          <a href="{{ base_path }}/"{% if page.url == '/' %} aria-current="page"{% endif %}>About</a>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
              {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <a href="{{ domain }}{{ link.url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }} <i class="fas fa-arrow-right" aria-hidden="true"></i></a>
          {% endfor %}
        </div>
      </nav>
      <button class="theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme" aria-pressed="false">
        <i class="fas fa-adjust" aria-hidden="true"></i>
        <span class="sr-only">Switch color theme</span>
      </button>
    </div>
  </div>
</div>
